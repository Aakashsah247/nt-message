services:
  - type: web
    name: nt-message-aakash-test-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter api build
    startCommand: pnpm --filter api exec prisma migrate deploy --schema prisma/schema.prisma && pnpm --filter api db:seed && pnpm --filter api start:prod
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_VERSION
        value: 24.14.1
      - key: NODE_ENV
        value: production
      - key: DEPLOYMENT_PROFILE
        value: temporary_external_staging
      - key: ALLOW_UNSCANNED_STAGING_ATTACHMENTS
        value: "true"
      - key: API_HOST
        value: 0.0.0.0
      - key: TRUST_PROXY_MODE
        value: render
      - key: RATE_LIMIT_STORE
        value: native
      - key: API_INSTANCE_COUNT
        value: "1"
      - key: NATIVE_RATE_LIMIT_MAX_BUCKETS
        value: "100000"
      - key: WEB_ORIGIN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "2525"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_REQUIRE_TLS
        value: "true"
      - key: SMTP_FROM
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: OTP_HASH_SECRET
        generateValue: true
      - key: ACTIVATION_TOKEN_SECRET
        generateValue: true
      - key: MESSAGE_CRYPTO_ACTIVE_KEY_VERSION
        value: "1"
      - key: MESSAGE_ENCRYPTION_KEY_V1_B64
        sync: false
      - key: MESSAGE_SEARCH_INDEX_KEY_V1_B64
        sync: false
      - key: MESSAGE_SIGNING_PRIVATE_KEY_V1_DER_B64
        sync: false
      - key: MESSAGE_SIGNING_PUBLIC_KEY_V1_DER_B64
        sync: false
      - key: ACCESS_TOKEN_TTL_SECONDS
        value: "900"
      - key: REFRESH_TOKEN_TTL_SECONDS
        value: "604800"
      - key: AUTH_COOKIE_NAME
        value: nt_message_render_staging_refresh
      - key: LOGIN_MAX_ATTEMPTS
        value: "5"
      - key: LOGIN_LOCK_MINUTES
        value: "15"
      - key: OTP_TTL_MINUTES
        value: "10"
      - key: OTP_RESEND_COOLDOWN_SECONDS
        value: "60"
      - key: OTP_MAX_ATTEMPTS
        value: "5"
      - key: ACTIVATION_TOKEN_TTL_SECONDS
        value: "600"
      - key: ACTIVATION_INVITATION_TTL_HOURS
        value: "72"
      - key: SUPER_ADMIN_NAME
        sync: false
      - key: SUPER_ADMIN_EMAIL
        sync: false
      - key: SUPER_ADMIN_PHONE
        sync: false
      - key: SUPER_ADMIN_INITIAL_PASSWORD
        sync: false
      - key: INITIAL_ADMIN_USERNAME
        value: admin
      - key: ATTACHMENT_STORAGE_DRIVER
        value: supabase
      - key: ATTACHMENT_STORAGE_MAX_OBJECT_BYTES
        value: "52428800"
      - key: ATTACHMENT_UPLOAD_TEMP_DIR
        value: /tmp/nt-message-uploads
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: nt-message-staging
      - key: SUPABASE_SIGNED_URL_TTL_SECONDS
        value: "300"
      - key: MESSAGE_PRIVATE_ATTACHMENT_RETENTION_DAYS
        value: "90"
      - key: MESSAGE_PERSONAL_GROUP_ATTACHMENT_RETENTION_DAYS
        value: "30"
      - key: MESSAGE_OFFICIAL_GROUP_ATTACHMENT_RETENTION_DAYS
        value: "30"
      - key: ANNOUNCEMENT_ATTACHMENT_RETENTION_DAYS
        value: "90"
      - key: ATTACHMENT_SCAN_MODE
        value: disabled
      - key: WEB_PUSH_VAPID_PUBLIC_KEY
        sync: false
      - key: WEB_PUSH_VAPID_PRIVATE_KEY
        sync: false
      - key: WEB_PUSH_VAPID_SUBJECT
        sync: false
      - key: WEB_PUSH_TTL_SECONDS
        value: "300"

  - type: web
    name: nt-message-aakash-test-web
    runtime: static
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter web build
    staticPublishPath: ./apps/web/dist
    envVars:
      - key: NODE_VERSION
        value: 24.14.1
      - key: VITE_API_URL
        sync: false
      - key: VITE_SOCKET_URL
        sync: false
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https: wss:; media-src 'self' blob: https:; frame-src 'self' blob:; worker-src 'self' blob:; manifest-src 'self'; upgrade-insecure-requests"
      - path: /*
        name: Strict-Transport-Security
        value: "max-age=31536000; includeSubDomains; preload"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: Permissions-Policy
        value: "camera=(), microphone=(self), geolocation=(self), payment=(), usb=()"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
