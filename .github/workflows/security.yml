name: Security

on:
  pull_request:
  push:
    branches:
      - main
      - 'feature/**'
      - 'feat/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Dependency, secret and regression checks
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Scan tracked files for committed secrets
        run: node scripts/security_scan_tracked_files.mjs

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      - name: Generate Prisma client
        run: pnpm --filter api exec prisma generate
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/nt_message_ci

      - name: Run security regression and API build
        run: node scripts/run_security_gate.mjs
