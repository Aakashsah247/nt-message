name: Release Readiness

on:
  pull_request:
  push:
    branches:
      - main
      - 'feature/**'
      - 'feat/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-readiness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-readiness:
    name: Full application release gate
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run full release gate
        run: node scripts/run_release_gate.mjs
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/nt_message_ci
