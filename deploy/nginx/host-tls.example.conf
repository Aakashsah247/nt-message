# Example host-level Nginx TLS proxy for NT Message staging.
# Replace the hostname and certificate paths before enabling this file.

map $http_upgrade $nt_message_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name staging-message.example.ntc.net.np;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name staging-message.example.ntc.net.np;

    ssl_certificate     /etc/ssl/nt-message/fullchain.pem;
    ssl_certificate_key /etc/ssl/nt-message/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 260m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $nt_message_connection_upgrade;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
