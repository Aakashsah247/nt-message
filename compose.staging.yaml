name: ${COMPOSE_PROJECT_NAME:-nt-message-staging}

services:
  postgres:
    image: postgres:18.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --data-checksums"
    volumes:
      - staging_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks: [backend]

  clamav:
    # Pin the current ClamAV LTS security patch for repeatable staging builds.
    build:
      context: .
      dockerfile: deploy/Dockerfile.clamav
    restart: unless-stopped
    volumes:
      - staging_clamav_data:/var/lib/clamav
    networks: [backend]

  migrate:
    build:
      context: .
      dockerfile: deploy/Dockerfile.api
    env_file:
      - .env.staging
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
    command: ["pnpm", "--filter", "api", "db:migrate:deploy"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks: [backend]

  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    user: "${NT_MESSAGE_UID:-1000}:${NT_MESSAGE_GID:-1000}"
    env_file:
      - .env.staging
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: 4000
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
    volumes:
      - ${ATTACHMENT_STORAGE_HOST_PATH:-./deploy-data/attachments}:/var/lib/nt-message/attachments
      - ${PROFILE_PHOTO_STORAGE_HOST_PATH:-./deploy-data/profile-photos}:/var/lib/nt-message/profile-photos
      - ${GROUP_PHOTO_STORAGE_HOST_PATH:-./deploy-data/group-photos}:/var/lib/nt-message/group-photos
    depends_on:
      postgres:
        condition: service_healthy
      clamav:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks: [backend]

  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
    restart: unless-stopped
    ports:
      - "${STAGING_BIND_ADDRESS:-127.0.0.1}:${STAGING_HTTP_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    networks: [backend]

networks:
  backend:
    driver: bridge

volumes:
  staging_postgres_data:
  staging_clamav_data:
