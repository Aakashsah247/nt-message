name: nt-message

services:
  postgres:
    image: postgres:18.4-alpine
    restart: unless-stopped
    shm_size: 128mb

    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --data-checksums"

    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  valkey:
    image: valkey/valkey:9.1.0-alpine
    restart: unless-stopped

    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:?VALKEY_PASSWORD is required}

    command:
      - sh
      - -c
      - >
        exec valkey-server
        --appendonly yes
        --appendfsync everysec
        --requirepass "$$VALKEY_PASSWORD"

    ports:
      - "127.0.0.1:${VALKEY_PORT:-6379}:6379"

    volumes:
      - valkey_data:/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "valkey-cli -a \"$$VALKEY_PASSWORD\" ping 2>/dev/null | grep -q PONG"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  mailpit:
    image: axllent/mailpit:v1.30.1
    restart: unless-stopped

    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: 5000

    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"

    volumes:
      - mailpit_data:/data

volumes:
  postgres_data:
  valkey_data:
  mailpit_data:
